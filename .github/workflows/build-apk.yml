name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android SDK and write local.properties
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          SDK=""
          for d in \
            "${ANDROID_HOME:-}" \
            "${ANDROID_SDK_ROOT:-}" \
            /usr/local/lib/android/sdk \
            "$HOME/android-sdk"
          do
            if [ -n "$d" ] && [ -d "$d" ]; then
              SDK="$d"
              break
            fi
          done

          if [ -z "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sS -L -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            if [ -d "$SDK/cmdline-tools/cmdline-tools" ]; then
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "Wrote local.properties:"
          cat local.properties

          SM=""
          for p in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/12.0/bin/sdkmanager"
          do
            if [ -x "$p" ]; then SM="$p"; break; fi
          done

          if [ -n "$SM" ]; then
            yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
            "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Show error summary if build failed
        if: failure()
        run: |
          echo "===== Look for the real error below ====="
          find . -name "*.log" -path "*daemon*" | tail
          ls -la app/build/outputs/apk/debug || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionBodyTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
