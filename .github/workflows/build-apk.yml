name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check MediaPipe models
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/hand_landmarker.task ] || [ ! -f app/src/main/assets/pose_landmarker.task ]; then
            echo "WARNING: hand_landmarker.task or pose_landmarker.task is missing."
            echo "The APK will still build, but tracking will not start until both files are in assets."
          else
            ls -lh app/src/main/assets/*.task
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionBodyTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
