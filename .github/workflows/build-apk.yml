name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK=$SDK"
          ls -la "$SDK" || true
          ls -la "$SDK/platforms" || true

          echo "sdk.dir=$SDK" > local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
            "$SM" --sdk_root="$SDK" \
              "platforms;android-35" \
              "platforms;android-34" \
              "build-tools;35.0.0" \
              "build-tools;34.0.0" \
              "platform-tools" || true
          fi
          echo "Platforms now:"
          ls "$SDK/platforms" || true

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon > build-log.txt 2>&1
          STATUS=$?
          echo "===== FULL GRADLE LOG ====="
          cat build-log.txt
          echo "===== WHAT WENT WRONG ====="
          grep -A 25 "What went wrong" build-log.txt || true
          grep -E "^e: |FAILURE:" build-log.txt || true
          exit $STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build-log.txt
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionBodyTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
